[package]
name = "sandbox-api"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "sandbox-api"
path = "src/main.rs"

[dependencies]
sandbox-core = { path = "../sandbox-core" }
sandbox-backend-seatbelt = { path = "../sandbox-backend-seatbelt" }
sandbox-backend-bwrap = { path = "../sandbox-backend-bwrap" }
sandbox-egress-proxy = { path = "../sandbox-egress-proxy" }
axum = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
async-trait = { workspace = true }
